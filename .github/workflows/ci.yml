name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Run --help smoke test
        run: .build/release/swift-audio-switcher --help

      - name: Run list (may be empty on CI runners)
        run: .build/release/swift-audio-switcher list || true
