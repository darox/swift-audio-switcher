name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (arm64)
        run: swift build -c release --arch arm64

      - name: Build (x86_64)
        run: swift build -c release --arch x86_64

      - name: Run --help smoke test
        run: .build/arm64-apple-macosx/release/swift-audio-switcher --help

      - name: Run list (may be empty on CI runners)
        run: .build/arm64-apple-macosx/release/swift-audio-switcher list || true
