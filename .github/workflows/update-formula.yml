name: Update Homebrew formula

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-formula:
    name: Update formula on tag push
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          gh release download "$TAG" --pattern "*-universal.tar.gz" --dir /tmp
          echo "Downloaded: $(ls /tmp/*.tar.gz)"

      - name: Compute SHA256 of tarball
        run: |
          TAG="${{ github.event.release.tag_name }}"
          SHA=$(shasum -a 256 /tmp/swift-audio-switcher-${TAG}-universal.tar.gz | awk '{print $1}')
          echo "SHA256: $SHA"
          echo "SHA256=$SHA" >> "$GITHUB_ENV"

      - name: Update formula
        run: |
          TAG="${{ github.event.release.tag_name }}"
          # Update the URL and SHA in the formula
          sed -i '' "s|refs/tags/v[0-9.]*|refs/tags/${TAG}|g" Formula/swift-audio-switcher.rb
          # Replace the sha256 line
          sed -i '' "/sha256 /c\\
  sha256 \"${SHA}\"  # ${TAG}" Formula/swift-audio-switcher.rb
          echo "--- Updated formula ---"
          cat Formula/swift-audio-switcher.rb

      - name: Commit and push formula update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/swift-audio-switcher.rb
          git commit -m "chore: update formula to ${{ github.event.release.tag_name }} [skip ci]"
          git push
