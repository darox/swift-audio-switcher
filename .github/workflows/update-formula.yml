name: Update Homebrew formula

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-formula:
    name: Update formula after release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract tag and compute SHA from source tarball
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          curl -sL "https://github.com/darox/swift-audio-switcher/archive/refs/tags/${TAG}.tar.gz" -o /tmp/source.tar.gz
          SHA=$(shasum -a 256 /tmp/source.tar.gz | awk '{print $1}')
          echo "Source tarball SHA256: $SHA"
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      - name: Update formula
        run: |
          sed -i '' "s|refs/tags/v[0-9.]*|refs/tags/${TAG}|g" Formula/swift-audio-switcher.rb
          sed -i '' "s|sha256 \"[a-f0-9]*\"|sha256 \"${SHA}\"|g" Formula/swift-audio-switcher.rb
          echo "--- Updated formula ---"
          cat Formula/swift-audio-switcher.rb

      - name: Commit and push formula update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/swift-audio-switcher.rb
          git commit -m "chore: update formula to ${TAG} [skip ci]"
          git push
