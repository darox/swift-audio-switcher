name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build, release, update formula
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (arm64)
        run: swift build -c release --arch arm64 --disable-sandbox

      - name: Build (x86_64)
        run: swift build -c release --arch x86_64 --disable-sandbox

      - name: Create universal binary
        run: |
          lipo -create \
            .build/arm64-apple-macosx/release/swift-audio-switcher \
            .build/x86_64-apple-macosx/release/swift-audio-switcher \
            -output swift-audio-switcher
          strip swift-audio-switcher

      - name: Package
        run: |
          mkdir -p dist
          cp swift-audio-switcher dist/
          cp README.md LICENSE.md dist/
          tar -czf dist/swift-audio-switcher-${{ github.ref_name }}-universal.tar.gz -C dist .
          shasum -a 256 dist/swift-audio-switcher-${{ github.ref_name }}-universal.tar.gz \
            | awk '{print $1}' > dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/swift-audio-switcher-${{ github.ref_name }}-universal.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          name: Release ${{ github.ref_name }}

      # The formula builds from GitHub's auto-generated tag tarball, so its
      # checksum must be computed from that exact URL. This runs in the same
      # workflow because a release created with GITHUB_TOKEN does not trigger
      # a separate `release: published` workflow.
      - name: Update Homebrew formula
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sL -H "Authorization: Bearer ${GH_TOKEN}" "https://github.com/darox/swift-audio-switcher/archive/refs/tags/${TAG}.tar.gz" -o /tmp/source.tar.gz
          SHA=$(shasum -a 256 /tmp/source.tar.gz | awk '{print $1}')
          echo "source tarball sha256: ${SHA}"

          git fetch origin main
          git checkout -B main origin/main

          sed -i '' "s|refs/tags/v[0-9][0-9.]*\.tar\.gz|refs/tags/${TAG}.tar.gz|g" Formula/swift-audio-switcher.rb
          sed -i '' "s|sha256 \"[a-f0-9]*\"|sha256 \"${SHA}\"|g" Formula/swift-audio-switcher.rb
          cat Formula/swift-audio-switcher.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/swift-audio-switcher.rb
          git commit -m "chore: update Homebrew formula to ${TAG} [skip ci]"
          git push origin main
